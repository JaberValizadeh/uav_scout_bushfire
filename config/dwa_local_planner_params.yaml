# DWA, tuned to the Scout as this package drives it.
#
# The vehicle is skid-steer in reality but is driven here by
# libgazebo_ros_planar_move (see the xacro), which would happily accept a
# lateral command. holonomic_robot stays false anyway: the point of the
# scenario is a ground vehicle that has to turn before it can go, and a planner
# that strafed would be modelling a robot this is not.
DWAPlannerROS:
  holonomic_robot: false

  max_vel_x: 1.1
  min_vel_x: -0.3          # enough to back out of a recovery, no more
  max_vel_trans: 1.1
  min_vel_trans: 0.08
  max_vel_theta: 1.2
  min_vel_theta: 0.3

  acc_lim_x: 1.2
  acc_lim_theta: 2.0
  acc_lim_y: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0

  # A tender's goal is a standing point beside a fire, not a dock, so there is
  # no reason to be fussy about the last few centimetres - and being fussy
  # costs it seconds of shuffling during which it is not `ready` and no drone
  # can take water from it. Yaw is free entirely: which way a water point faces
  # means nothing.
  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 6.30
  latch_xy_goal_tolerance: true

  sim_time: 2.0
  vx_samples: 12
  vth_samples: 20
  path_distance_bias: 34.0
  goal_distance_bias: 20.0
  occdist_scale: 0.03
  forward_point_distance: 0.3
  stop_time_buffer: 0.3
  scaling_speed: 0.3
  max_scaling_factor: 0.25

  oscillation_reset_dist: 0.15
  prune_plan: true
